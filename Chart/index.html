<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chart.js Tutorial</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    .chart-container {
      width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>

  <h2>My First Chart</h2>

  <div class="chart-container">
    <canvas id="myChart"></canvas>
  </div>

  <!-- ✅ Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // JS will go here
const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: 'pie',
  data: {
    labels: ['Red', 'Blue', 'Yellow'],
    datasets: [{
      data: [10, 20, 30],
      backgroundColor: ['red', 'blue', 'yellow']
    }]
  }
});
  </script>

</body>
</html>
